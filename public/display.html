<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter Display</title>
    <!-- Installable as its own app: a shortcut that opens straight to the prompter
         screen in fullscreen, no browser chrome. See manifest-controller.json for the
         operator panel's own shortcut. -->
    <link rel="manifest" href="manifest-display.json">
    <meta name="theme-color" content="#101010">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-display.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Prompter">
    <script src="js/i18n.js"></script>
    <script src="js/pwa.js"></script>
    <link rel="stylesheet" href="css/display.css">
</head>
<body>
    <div class="display-container">
        <div class="timer-display">
            <div id="countdown-timer">10:00</div>
            <div id="speed-hud" class="speed-hud">1.0x</div>
            <div id="elapsed-time">00:00</div>
        </div>
        
        <div class="text-area">
            <div class="reading-line" id="reading-line" hidden></div>
            <div class="scheduled-countdown" id="scheduled-countdown">
                <div class="countdown-label" data-i18n="display.scheduledIn">Scheduled Start In:</div>
                <div class="countdown-time" id="countdown-time">00:00:00</div>
                <div class="countdown-target" id="countdown-target">Starting at: --:--:--</div>
            </div>
            
            <div class="preroll" id="preroll" hidden></div>

            <div class="next-cue" id="next-cue" hidden>
                <span class="next-cue-in" id="next-cue-in">in 15s</span>
                <span class="next-cue-label" id="next-cue-label"></span>
            </div>
            <div id="prompter-text" class="prompter-rich">
                <p data-i18n="display.waiting">Waiting for controller connection...</p>
                <p data-i18n="display.waitingHint">Open the controller page to load your manuscript and begin prompting.</p>
            </div>
            <div class="display-progress" id="display-progress" data-position="hidden" hidden><span id="display-progress-fill"></span></div>
        </div>

        <div class="fullscreen-hint" id="fullscreen-hint" data-i18n="display.fullscreenHint">Press any key for fullscreen</div>
        
        <div class="on-air-indicator" id="on-air-indicator">
            <div class="on-air-light"></div>
            <span class="on-air-text" data-i18n="display.onAir">ON AIR</span>
        </div>
        
        <div class="connection-status" id="connection-status">
            <span class="status-indicator disconnected">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>
            </span>
            <span class="status-text">Disconnected</span>
        </div>
    </div>
    
    <script src="js/display.js"></script>
</body>
</html>
