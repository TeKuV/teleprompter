# Production compose. The other file is for development: it bind-mounts the working copy
# over /app so edits show up on refresh, which is exactly what a deployment must not do -
# there the built image is the artefact, and nothing on the host may override it.
services:
  teleprompter:
    build: .
    image: freeprompter:latest
    # A prompter that stays down after a reboot is a prompter that fails at 6am.
    restart: unless-stopped
    ports:
      # Bound to the loopback: TLS and the WebSocket upgrade are the reverse proxy's job,
      # and a secure context is what gives the browser its clipboard back. Publish on
      # 0.0.0.0 only if this really is the only thing in front.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      SETTINGS_FILE: /app/data/settings.json
    volumes:
      # Session names and languages outlive the container they were written in.
      - prompter-data:/app/data

    # server.js installs its own SIGTERM handler and hangs up the WebSocket clients
    # before closing the server; this gives it room to finish rather than be killed.
    stop_grace_period: 20s

    # A prompter left running for weeks should not fill the disk with its own logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Terminates TLS and gets its certificate from Let's Encrypt on its own - no certbot,
  # no renewal cron job. Needs DOMAIN and ACME_EMAIL in a .env file beside this compose
  # file, and DOMAIN must already resolve to this host with 80/443 reachable from the
  # internet (the ACME HTTP challenge answers on 80). See deploy/Caddyfile.
  # Prefer the host-level nginx + certbot setup in deploy/nginx.conf instead if TLS
  # already terminates elsewhere on this machine.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - teleprompter
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, see .env.example}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prompter-data:
  caddy-data:
  caddy-config:
