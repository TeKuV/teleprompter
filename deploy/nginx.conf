# free Teleprompter - nginx vhost.
# Install as /etc/nginx/sites-available/teleprompter, symlink into sites-enabled,
# replace prompteur.example.com throughout, then: nginx -t && systemctl reload nginx
#
# Certificate first (this file references paths certbot has not created yet):
#   certbot certonly --webroot -w /var/www/certbot -d prompteur.example.com

# Translates the hop-by-hop Upgrade header into what proxy_pass must send. Without it
# every WebSocket handshake answers 200 with the HTML page instead of 101, and the
# prompter shows "Disconnected" while the page itself loads fine.
# sites-enabled is included inside http{}, so a map here is in the right context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name prompteur.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prompteur.example.com;

    ssl_certificate     /etc/letsencrypt/live/prompteur.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompteur.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # TLS is not cosmetic here: the voice-tracking feature uses SpeechRecognition,
    # which browsers refuse outside a secure context.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;

    # The app serves no cache headers of its own and its asset URLs carry no version,
    # so a browser is free to keep a stale controller.js next to a fresh controller.css
    # after a deploy. Revalidate instead; the whole payload is well under 200 KB.
    add_header Cache-Control "no-cache" always;

    # --- Access control -------------------------------------------------------------
    # The app has no login: the session id in the URL is the only thing standing between
    # a stranger and control of a live prompter. Uncomment to require a password, and
    # note it has to cover this whole block - the WebSocket connects to "/" for the
    # display as well as the controller, so protecting only the controller path would
    # break the display's socket.
    #   apt install apache2-utils
    #   htpasswd -c /etc/nginx/.htpasswd operator
    # auth_basic           "free Teleprompter";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    #
    # If the studio has a fixed address, an allow-list is less friction than a password
    # a display machine has to re-enter:
    # allow 203.0.113.0/24;
    # deny  all;
    # --------------------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A prompter holds one socket for the length of a broadcast. The clients ping
        # every 5s so the default 60s would survive, but a long segment must not depend
        # on a heartbeat arriving on time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Scrolling commands are small and latency-sensitive: pass them straight through
        # rather than letting nginx accumulate a buffer first.
        proxy_buffering off;
    }
}
